---
version: 2

# Only github-actions: package.json carries the version for release-please and no
# dependencies, so an npm entry here would have nothing to update.
updates:
  - package-ecosystem: "github-actions"
    assignees:
      - "JanaME"
    commit-message:
      prefix: "deps"
      include: "scope"
    cooldown:
      default-days: 7
    directory: "/.github/"
    open-pull-requests-limit: 10
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Europe/Berlin"
    groups:
      github-actions:
        patterns:
          - "*"
